# =============================================================================
# Mosaicr - Sample Configuration
# =============================================================================
# Copy this file and adjust values for your mosaic project.
# Lines starting with # are comments.
# Format: key=value

# -----------------------------------------------------------------------------
# Tile Dimensions (pixels)
# -----------------------------------------------------------------------------
# Width of each tile. Source images are cropped and resized to this width.
defaultTileWidth=200

# Height of each tile. Source images are cropped and resized to this height.
defaultTileHeight=300

# -----------------------------------------------------------------------------
# Grid Layout
# -----------------------------------------------------------------------------
# Base number of columns. The grid scales up in multiples of this value
# until there are enough cells for all available tiles.
defaultHorizontalTileCount=19

# Base number of rows. Scales together with columns to preserve the ratio.
defaultVerticalTileCount=4

# -----------------------------------------------------------------------------
# Behavior
# -----------------------------------------------------------------------------
# When true, tiles are placed in random order.
# When false, tiles are placed in directory listing order.
shuffleEnabled=true

# Controls what happens when there are fewer tiles than grid cells.
# true  = reuse (cycle) tiles to fill all cells
# false = fill empty cells with solid-color rectangles
fillUpMissingTilesWithImages=false

# -----------------------------------------------------------------------------
# Colors
# -----------------------------------------------------------------------------
# Background color for the canvas and empty tiles (hex #RRGGBB).
backgroundColor=#000000

# Color ranges for empty tile fills. Comma-separated pairs of #LOWER-#UPPER.
# Each RGB channel is independently randomized between the bounds.
tilesColorRange=#FF4F00-#FFBF00,#FFA500-#FFC520

# Output color mode: RGB (full color) or BW (grayscale).
targetImageType=RGB

# -----------------------------------------------------------------------------
# Filling Strategy
# -----------------------------------------------------------------------------
# Strategy name used to resolve the tile placement implementation.
# Known values: NORMAL, CIRCLE
imageFillingType=CIRCLE

# Maximum random pixel offset applied to each tile's position.
# 0 = tiles placed exactly on the grid. Higher values add jitter.
placementBlur=0

# Strategy class mappings (strategy name + _CLASS = implementation class)
NORMAL_CLASS=SimpleGridStrategy
CIRCLE_CLASS=CircleFillingStrategy
